<script src="./lib/vendor/p5.min.js" data-head ></script>
<script src="./lib/shader-snippets/noise.js" type="text/javascript" data-head ></script>

<script id="sketch">
let fillShader;

let vertSrc = `
precision highp float;
attribute vec3 aPosition;
uniform mat4 uProjectionMatrix;
uniform mat4 uModelViewMatrix;
varying vec3 vPosition;
varying float HEIGHT;
varying vec3 vNormal;
uniform vec2 u_size;
uniform float u_time;

${noiseLib}

#define SCALE 5.0
#define OCTAVES 12

float height(vec2 p) {
  float o = u_time * .1;
  vec2 ap = vec2(p.x, p.y - o); 
  return fbm(ap * SCALE, OCTAVES) * HEIGHT;
}

void main() {
  HEIGHT = 200.;
  vPosition = aPosition;
  vPosition.z += height(vPosition.xy);

  float e = 1.0 / 256.0;
  float hx = height(aPosition.xy + vec2(e, 0.0)) - height(aPosition.xy - vec2(e, 0.0));
  float hy = height(aPosition.xy + vec2(0.0, e)) - height(aPosition.xy - vec2(0.0, e));
  vNormal = normalize(vec3(-hx / (2.0 * e * u_size.x), -hy / (2.0 * e * u_size.y), 1.0));

  gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(vPosition, 1.0);
}
`;

let fragSrc = `
precision highp float;
varying vec3 vPosition;
varying vec3 vNormal;
varying float HEIGHT;

void main() {
    vec3 n = normalize(vNormal);
    vec3 lig = normalize(vec3(-0.5, 0.6, 0.6));

    float dif = clamp(dot(n, lig), 0.0, 1.0);
    float amb = 0.2;

    float d = mix(1., 0., smoothstep(1., 0., sqrt(vPosition.y + .5)));

    vec3 lowcol = vec3(.01, .005, .0); 
    vec3 highcol = vec3(1., 1., 1.); 

    vec3 basecol = vec3(vPosition.z / HEIGHT) * (amb + dif);
    basecol *= mix(lowcol, highcol, smoothstep(0.2, 1., pow(vPosition.z / HEIGHT, 1.9)));

    vec4 fogcol = vec4(.8, .8, .9, 1.0);
    vec4 col = vec4(basecol, 1.0);
    col = mix(fogcol, col, d);

    gl_FragColor = fogcol;
    gl_FragColor = col;
}
`;

let t = 0;

function setup() {
  createCanvas(450, 450, WEBGL);
  fillShader = createShader(vertSrc, fragSrc);
  shader(fillShader);
  noStroke();
}

function draw() {
  background(255 * .8, 255 * .8, 255 * .9);
  t += .01;
  fillShader.setUniform('u_resolution', [width * pixelDensity(), height * pixelDensity()]);
  fillShader.setUniform('u_time', t);
  fillShader.setUniform('u_size', [width, height]);
  orbitControl();
  rotateX(PI/3);
  translate(0, 200, 0);
  plane(width * 2, height * 2, 512, 512);
}
</script>
